name: Deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"     # 매일 06:17(한국 시간)에 Velog 새 글을 가져와 다시 배포
  workflow_dispatch:           # 바로 반영하고 싶으면 Actions 탭에서 수동 실행
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build posts.js
        run: python3 build.py --require-velog   # Velog를 못 받으면 배포하지 않고 이전 사이트를 유지
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css lib.js terminal.js config.js app.js owner.js posts.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
